Name: Epic Streaming

Summary: Music streaming client for self-hosted Navidrome servers

Description: |
  Epic Streaming is an Android music streaming client for self-hosted
  Navidrome servers.

  Features include music library browsing, albums, artists, songs,
  album artwork, music playback, Android media controls, and
  notification playback controls.

