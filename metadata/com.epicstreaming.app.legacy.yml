Name: Epic Streaming Classic

Summary: Classic music streaming client for self-hosted Navidrome servers

Description: |
  Epic Streaming Classic is an Android music streaming client for
  self-hosted Navidrome servers, designed for older Android devices.

  Features include music library browsing, albums, artists, songs,
  album artwork, music playback, Android media controls, and
  notification playback controls.

