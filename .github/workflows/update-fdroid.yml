name: Update F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install F-Droid Server Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver

      - name: Create F-Droid signing key
        run: |
          fdroid init

      - name: Generate repository index
        run: |
          fdroid update --create-metadata

      - name: Commit generated repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/ metadata/ config.yml
          git diff --cached --quiet || git commit -m "Update F-Droid repository"
          git push
