name: Update F-Droid Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fdroid-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install F-Droid Server
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install fdroidserver

      - name: Restore F-Droid signing key
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
          chmod 600 keystore.p12

      - name: Create temporary F-Droid configuration
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cat > config.yml <<EOF
          repo_url: https://verityofficial.github.io/EStreamFDroid/repo
          repo_name: Epic Streaming
          repo_description: Official F-Droid repository for Epic Streaming
          keystore: keystore.p12
          repo_keyalias: fdroidrepo
          keystorepass: $FDROID_KEYSTORE_PASSWORD
          keypass: $FDROID_KEY_PASSWORD
          EOF

          chmod 600 config.yml

      - name: Generate F-Droid repository
        run: |
          fdroid update --create-metadata

      - name: Restore public configuration
        run: |
          git checkout -- config.yml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated repository
        run: |
          git add repo/ metadata/

          if git diff --cached --quiet; then
            echo "No F-Droid repository changes."
            exit 0
          fi

          git commit -m "Update F-Droid repository"

      - name: Push generated repository
        run: |
          git push origin HEAD:main

      - name: Remove signing key
        if: always()
        run: |
          rm -f keystore.p12
          rm -f config.yml
